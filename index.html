<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>Plan</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><text x='50' y='50' font-size='60' fill='white' text-anchor='middle' dominant-baseline='central'>P</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="app">

    <!-- ============ ЗАДАЧИ ============ -->
    <section class="block">
      <div class="block-head">
        <span class="date-label" id="dateLabel"></span>
        <button class="icon" id="btnAddTask" aria-label="Добавить">+</button>
      </div>
      <p class="progress" id="progressLabel">0 из 0</p>
      <ul class="task-list" id="taskList"></ul>
      <p class="empty hidden" id="emptyTasks">нет задач</p>
    </section>

    <!-- ============ КАЛЕНДАРЬ ============ -->
    <section class="block" id="calendarBlock">
      <div class="cal-head">
        <button class="icon" id="calPrev">‹</button>
        <span id="calMonthLabel"></span>
        <button class="icon" id="calNext">›</button>
      </div>
      <div class="cal-weekdays">
        <span>П</span><span>В</span><span>С</span><span>Ч</span><span>П</span><span>С</span><span>В</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </section>

    <!-- ============ ЧАТ ============ -->
    <section class="block" id="chatBlock">
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input">
        <input type="text" id="chatInput" />
        <button class="icon" id="btnSend" aria-label="Отправить">→</button>
      </div>
    </section>

  </main>

  <!-- ============ ШТОРКА ДНЯ ============ -->
  <div class="sheet-backdrop hidden" id="sheetBackdrop"></div>
  <div class="sheet hidden" id="daySheet">
    <div class="sheet-head">
      <span id="sheetDate"></span>
      <button class="icon" id="sheetClose">×</button>
    </div>
    <ul class="task-list" id="sheetTaskList"></ul>
  </div>

  <!-- ============ МОДАЛКА ЗАДАЧИ ============ -->
  <div class="modal-backdrop hidden" id="taskBackdrop"></div>
  <div class="modal hidden" id="taskModal">
    <div class="modal-head">
      <span id="taskModalTitle">Новая</span>
      <button class="icon" id="taskClose">×</button>
    </div>
    <input type="text" id="taskTitle" class="input" placeholder="название" />
    <input type="date" id="taskDate" class="input" />
    <input type="time" id="taskTime" class="input" />
    <input type="number" id="taskDuration" class="input" value="30" min="5" step="5" />
    <select id="taskCategory" class="input">
      <option value="work">работа</option>
      <option value="study">учёба</option>
      <option value="sport">спорт</option>
      <option value="personal">личное</option>
      <option value="health">здоровье</option>
      <option value="other">другое</option>
    </select>
    <button class="btn" id="taskSave">сохранить</button>
  </div>

  <!-- ============ МОДАЛКА API-КЛЮЧА (первый запуск) ============ -->
  <div class="modal-backdrop hidden" id="keyBackdrop"></div>
  <div class="modal hidden" id="keyModal">
    <div class="modal-head">
      <span>API-ключ</span>
      <button class="icon" id="keyClose">×</button>
    </div>
    <p class="hint">вставь ключ DeepSeek или OpenRouter. без ключа — демо-режим.</p>
    <input type="password" id="keyInput" class="input" placeholder="sk-..." />
    <button class="btn" id="keySave">готово</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
